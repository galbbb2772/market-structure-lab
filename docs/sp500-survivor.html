<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S&P Survivor Diagnostic</title><style>:root{--bg:#081016;--p:#0f1b24;--p2:#142530;--l:#243a47;--t:#dbe7ef;--m:#91a6b5;--g:#69d5b3;--r:#ff8b8b;--a:#ffcc77}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071017,#0a141b 35%,#081016);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.w{max-width:1300px;margin:auto;padding:20px}.top,.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.08em}.brand span{color:var(--g)}a{color:var(--t);text-decoration:none;border:1px solid var(--l);padding:8px 10px;border-radius:9px;background:#10202a}.hero{padding:35px 0 18px}.hero h1{font-size:clamp(30px,5vw,54px);margin:8px 0}.hero p,p,small{color:var(--m)}.panel{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px;margin:15px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric,.card{background:var(--p2);border:1px solid var(--l);border-radius:11px;padding:13px}.metric b{display:block;font-size:23px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.scroll{overflow:auto}.pill{display:inline-block;border:1px solid var(--l);padding:5px 8px;border-radius:999px;color:var(--m);font-size:12px}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:right}th:first-child,td:first-child{text-align:left}.pos{color:var(--g)}.neg{color:var(--r)}.warn{color:var(--a)}@media(max-width:760px){.metrics,.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.metrics,.grid{grid-template-columns:1fr}.w{padding:12px}}</style></head><body><main class="w"><div class="top"><div class="brand">MARKET <span>STRUCTURE</span> LAB</div><div><a href="./pattern-edge.html">严格验证</a> <a href="./concentration-lab.html">Analog</a></div></div><header class="hero"><div class="pill">S&P 500 · SURVIVOR DIAGNOSTIC</div><h1>唯一 FDR Survivor 的结构拆解</h1><p>D1 · 牛市代理 · 60D低位 · 中波动 · T+5。此页只解释这个状态“长什么样”，不把它提升成交易规则。</p></header><section class="panel"><div id="status">读取数据…</div><div id="metrics" class="metrics"></div></section><section class="panel"><h2>它与普通 D1 的差别</h2><div id="features" class="scroll"></div></section><section class="panel"><h2>内部切片</h2><p>这些只是诊断切片，不再进行二次挑选形成新规则。</p><div id="splits" class="grid"></div></section></main><script>const $=x=>document.getElementById(x),f=(x,n=2)=>x==null?'—':(+x).toFixed(n),pct=x=>x==null?'—':f(x)+'%';let D;function c(v){return +v>0?'pos':+v<0?'neg':''}function render(){let a=D.full_history.baseline_D1,t=D.full_history.target_state;$('status').innerHTML=`完整历史描述样本：D1 基准 <b>${a.n}</b>，目标状态 <b>${t.n}</b>。严格 OOS Survivor 本身仍只有 N=52，因此这里仅用于解释结构。`;$('metrics').innerHTML=[['D1基准 T+5上涨',pct(a.t5_up_pct)],['目标状态 T+5上涨',pct(t.t5_up_pct)],['D1基准中位收益',pct(a.t5_median)],['目标状态中位收益',pct(t.t5_median)]].map(x=>`<div class="metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');let keys=[['day_ret','当天收益'],['pre5','此前5日'],['pre10','此前10日'],['dd20','距20D高点'],['dd60','距60D高点'],['ma20_dist','距MA20'],['ma50_dist','距MA50'],['ma200_dist','距MA200'],['rsi14','RSI14'],['atr_rank','ATR分位'],['pos60','60D位置']];let b=D.full_history.baseline_features,u=D.full_history.target_features;$('features').innerHTML=`<table><thead><tr><th>特征</th><th>普通D1中位数</th><th>目标状态中位数</th></tr></thead><tbody>${keys.map(([k,l])=>`<tr><td>${l}</td><td>${f(b[k].median)}</td><td>${f(u[k].median)}</td></tr>`).join('')}</tbody></table>`;$('splits').innerHTML=D.diagnostic_splits.map(s=>`<div class="card"><b>${s.name}</b><table><thead><tr><th>组</th><th>N</th><th>T+5上涨</th><th>中位收益</th></tr></thead><tbody>${Object.entries(s.groups).map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${pct(v.t5_up_pct)}</td><td class="${c(v.t5_median)}">${pct(v.t5_median)}</td></tr>`).join('')}</tbody></table></div>`).join('')}fetch('./data/sp500_survivor_diagnostic.json?ts='+Date.now()).then(r=>r.json()).then(x=>{D=x;render()}).catch(e=>$('status').textContent='读取失败：'+e.message)</script></body></html>
