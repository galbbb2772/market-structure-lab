name: Research Large Temporal Stability V1

on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/large_temporal_stability_v1/PREREGISTRATION.md'
      - 'research_pure_box_large_temporal_stability_year_v1.py'
      - 'research_pure_box_large_temporal_stability_combine_v1.py'
      - '.github/workflows/research_large_temporal_stability_v1.yml'

permissions:
  contents: write
  actions: read

jobs:
  year:
    strategy:
      fail-fast: false
      matrix:
        year: [2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - name: Download source artifacts
        run: |
          mkdir -p /tmp/source
          y=${{ matrix.year }}
          for yy in $((y-1)) $y $((y+1)); do
            if [ "$yy" -ge 2019 ] && [ "$yy" -le 2026 ]; then
              mkdir -p "/tmp/source/$yy"
              gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-$yy" -D "/tmp/source/$yy"
            fi
          done
      - run: python research_pure_box_large_temporal_stability_year_v1.py --year ${{ matrix.year }} --indir /tmp/source --outdir /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: temporal-stability-${{ matrix.year }}
          path: /tmp/result/*
          retention-days: 7

  combine:
    needs: year
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with: {pattern: temporal-stability-*, path: /tmp/shards}
      - run: python research_pure_box_large_temporal_stability_combine_v1.py --indir /tmp/shards --outdir /tmp/final
      - run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/final/summary.json'))
          a=pd.read_csv('/tmp/final/annual_stability.csv')
          q=pd.read_csv('/tmp/final/quarterly_stability.csv')
          g=pd.read_csv('/tmp/final/geometry_control.csv')
          assert d['schema']=='LARGE-TEMPORAL-STABILITY-V1'
          assert len(a)==32 and len(q)>100 and len(g)==48
          print(len(a),len(q),len(g))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/large_temporal_stability_v1
          cp /tmp/final/summary.json research/pure_box_liquid_leaders_v1/large_temporal_stability_v1/
          cp /tmp/final/annual_stability.csv research/pure_box_liquid_leaders_v1/large_temporal_stability_v1/
          cp /tmp/final/quarterly_stability.csv research/pure_box_liquid_leaders_v1/large_temporal_stability_v1/
          cp /tmp/final/rolling_4q_stability.csv research/pure_box_liquid_leaders_v1/large_temporal_stability_v1/
          cp /tmp/final/geometry_control.csv research/pure_box_liquid_leaders_v1/large_temporal_stability_v1/
          cp /tmp/final/geometry_thresholds.json research/pure_box_liquid_leaders_v1/large_temporal_stability_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/large_temporal_stability_v1
          git commit -m 'research: run Large Temporal Stability V1' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
