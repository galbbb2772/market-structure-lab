name: Research UpDown Divergence Regime Gate OOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_updown_divergence_regime_gate_oos.py'
      - '.github/workflows/research_updown_divergence_regime_gate_oos.yml'
      - 'docs/data/updown_divergence_oos.json'
      - 'docs/data/structure_lab.json'

concurrency:
  group: updown-divergence-regime-gate-oos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run locked regime-gate OOS study
        run: python research_updown_divergence_regime_gate_oos.py
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/updown_divergence_regime_gate_oos.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'data: update locked regime gate OOS study'
          git pull --rebase origin main
          git push
