name: Refresh Market State Box V1

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 2-6'
  push:
    branches: [main]
    paths:
      - 'build_market_state_box_v1.py'
      - '.github/workflows/market_state_box_v1.yml'

permissions:
  contents: write

concurrency:
  group: market-state-box-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build joint market-state dataset
        run: python build_market_state_box_v1.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/market_state_box_v1.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('schema') == 'MARKET-STATE-BOX-V1'
          assert (d.get('coverage') or {}).get('observations', 0) > 100
          assert 'all_four' in (d.get('ablation') or {})
          print(d['coverage'], d['ablation']['all_four'])
          PY

      - name: Commit refreshed research data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/market_state_box_v1.json
          if git diff --cached --quiet; then
            echo 'No dataset change.'
          else
            git commit -m 'data: refresh Market State Box V1'
            git push
          fi

# bootstrap: editing this workflow triggers the first dataset build on main.
