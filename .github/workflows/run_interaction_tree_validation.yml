name: Run Interaction Tree Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_interaction_tree.py'
      - '.github/workflows/run_interaction_tree_validation.yml'

permissions:
  contents: write

concurrency:
  group: interaction-tree-validation
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Run interaction validation
        run: python research_interaction_tree.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/interaction_tree_validation.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "data: refresh interaction tree validation"
            git pull --rebase origin main
            git push
          fi
