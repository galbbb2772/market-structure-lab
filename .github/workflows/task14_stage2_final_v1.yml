name: Task 1/4 Final Stage-2 Diagnostics V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_task14_stage2_final_v1.py'
      - 'research/task14_stage2_final_v1/STUDY_SPEC.md'
      - '.github/workflows/task14_stage2_final_v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run final Stage-2 diagnostics
        run: python research_task14_stage2_final_v1.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          p='docs/data/task14_stage2_final_v1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['schema']=='TASK14-STAGE2-FINAL-V1'
          assert d['research_only'] is True and d['diagnostic_only'] is True
          assert d['production_effect']=='none'
          assert d['thresholds_changed'] is False
          assert d['coverage']['full_sequence_events']==12
          assert len(d['threshold_stability_surface']['cells'])==27
          assert d['decision']['may_change_production'] is False
          assert d['decision']['may_change_existing_forward_oos'] is False
          assert d['decision']['may_optimize_thresholds_from_surface'] is False
          for k in ('matched_control','threshold_stability_surface','lead_lag_event_study','orthogonal_information','indicator_redundancy_map'):
              assert k in d
          print('TASK14_STAGE2_FINAL_VALID', {
              'matched_10d': d['matched_control']['aggregate']['10d'],
              'surface_positive_10d_share': d['threshold_stability_surface']['positive_10d_share_pct'],
              'redundancy_features': d['indicator_redundancy_map']['feature_count'],
          })
          PY
      - name: Commit research data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/task14_stage2_final_v1.json
          if git diff --cached --quiet; then
            echo 'No Stage-2 final data change.'
          else
            git commit -m 'data: refresh Task 1/4 final Stage-2 diagnostics V1'
            git pull --rebase origin main
            git push
          fi
