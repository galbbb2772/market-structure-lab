name: Research SPX Divergence Final Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_spx_divergence_final_validation.py'
      - '.github/workflows/research_spx_divergence_final_validation.yml'
      - 'research_updown_divergence_events.py'
      - 'research_updown_divergence_regime.py'
      - 'docs/data/structure_lab.json'

concurrency:
  group: spx-divergence-final-validation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen SPX validation pack
        run: python research_spx_divergence_final_validation.py
      - name: Commit validation result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/spx_divergence_final_validation.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'data: update SPX divergence final validation'
          git pull --rebase origin main
          git push
