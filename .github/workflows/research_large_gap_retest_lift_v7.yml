name: Research Large Gap Retest Lift V7

on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/large_gap_retest_lift_v7/PREREGISTRATION.md'
      - 'research_pure_box_large_gap_retest_lift_v7.py'
      - '.github/workflows/research_large_gap_retest_lift_v7.yml'

permissions:
  contents: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ANATOMY_RUN: 37573754734
      RESILIENCE_RUN: 37558533895
      GEOMETRY_RUN: 37575291654
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - name: Download frozen labels and V6 events
        run: |
          mkdir -p /tmp/anatomy /tmp/resilience /tmp/events
          gh run download "$ANATOMY_RUN" -R "${{ github.repository }}" -n selloff-anatomy-mechanism -D /tmp/anatomy
          gh run download "$RESILIENCE_RUN" -R "${{ github.repository }}" -n relative-resilience-mechanism -D /tmp/resilience
          for y in 2021 2022 2023 2024 2025 2026; do
            mkdir -p "/tmp/events/$y"
            gh run download "$GEOMETRY_RUN" -R "${{ github.repository }}" -n "gap-geometry-$y" -D "/tmp/events/$y"
          done
      - run: |
          python research_pure_box_large_gap_retest_lift_v7.py             --anatomy-labels /tmp/anatomy/labeled_candidates.csv.gz             --resilience-labels /tmp/resilience/labeled_candidates.csv.gz             --events-dir /tmp/events             --outdir /tmp/final
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/final/summary.json'))
          c=pd.read_csv('/tmp/final/support_checks.csv')
          r=pd.read_csv('/tmp/final/joint_residual_control.csv')
          s=pd.read_csv('/tmp/final/state_summary.csv')
          assert d['schema']=='LARGE-GAP-RETEST-LIFT-V7'
          assert len(c)==8 and len(r)==8
          assert len(s)>=24
          print(json.dumps({k:d[k] for k in ['top500_low_progress_negative','top500_total','top500_primary_support','all_primary_support','all_total']},indent=2))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/large_gap_retest_lift_v7
          cp /tmp/final/summary.json research/pure_box_liquid_leaders_v1/large_gap_retest_lift_v7/
          cp /tmp/final/support_checks.csv research/pure_box_liquid_leaders_v1/large_gap_retest_lift_v7/
          cp /tmp/final/thresholds_by_year.csv research/pure_box_liquid_leaders_v1/large_gap_retest_lift_v7/
          cp /tmp/final/joint_residual_control.csv research/pure_box_liquid_leaders_v1/large_gap_retest_lift_v7/
          cp /tmp/final/state_yearly.csv research/pure_box_liquid_leaders_v1/large_gap_retest_lift_v7/
          cp /tmp/final/state_summary.csv research/pure_box_liquid_leaders_v1/large_gap_retest_lift_v7/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/large_gap_retest_lift_v7
          git commit -m 'research: run Large Gap Retest-vs-Lift V7' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
