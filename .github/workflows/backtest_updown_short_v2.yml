name: Backtest UpDown Short V2

on:
  push:
    branches: [main]
    paths:
      - 'backtest_updown_short_v2.py'
      - '.github/workflows/backtest_updown_short_v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run short V2 backtest
        run: python backtest_updown_short_v2.py
      - name: Commit short V2 result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/updown_short_v2.json
          git diff --cached --quiet || git commit -m 'data: update updown short V2 backtest'
          git push
