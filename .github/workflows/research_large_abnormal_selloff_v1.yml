name: Research Large Abnormal Selloff V1

on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/large_abnormal_selloff_v1/PREREGISTRATION.md'
      - 'research_pure_box_large_abnormal_selloff_year_v1.py'
      - 'research_pure_box_large_abnormal_selloff_combine_v1.py'
      - 'research_pure_box_large_abnormal_selloff_portfolio_v1.py'
      - 'research_pure_box_large_abnormal_selloff_finalize_v1.py'
      - '.github/workflows/research_large_abnormal_selloff_v1.yml'

permissions:
  contents: write
  actions: read

jobs:
  year:
    strategy:
      fail-fast: false
      matrix:
        year: [2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - name: Download source artifacts
        run: |
          mkdir -p /tmp/source
          y=${{ matrix.year }}
          for yy in $((y-1)) $y $((y+1)); do
            if [ "$yy" -ge 2019 ] && [ "$yy" -le 2026 ]; then
              mkdir -p "/tmp/source/$yy"
              gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-$yy" -D "/tmp/source/$yy"
            fi
          done
      - run: python research_pure_box_large_abnormal_selloff_year_v1.py --year ${{ matrix.year }} --indir /tmp/source --outdir /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: abnormal-selloff-observations-${{ matrix.year }}
          path: /tmp/result/*
          retention-days: 7

  mechanism:
    needs: year
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with: {pattern: abnormal-selloff-observations-*, path: /tmp/shards}
      - run: python research_pure_box_large_abnormal_selloff_combine_v1.py --indir /tmp/shards --outdir /tmp/mechanism
      - run: |
          python - <<'PY'
          import pandas as pd,json
          q=pd.read_csv('/tmp/mechanism/event_quintiles.csv');c=pd.read_csv('/tmp/mechanism/continuous_summary.csv');l=pd.read_csv('/tmp/mechanism/labeled_candidates.csv.gz')
          assert len(q)>=200 and len(c)==48 and len(l)>1000
          print(len(q),len(c),len(l))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: abnormal-selloff-mechanism
          path: /tmp/mechanism/*
          retention-days: 7

  portfolio:
    needs: mechanism
    strategy:
      fail-fast: false
      matrix:
        year: [2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with: {name: abnormal-selloff-mechanism, path: /tmp/mechanism}
      - name: Download source artifacts
        run: |
          mkdir -p /tmp/source
          y=${{ matrix.year }}
          for yy in $((y-1)) $y $((y+1)); do
            if [ "$yy" -ge 2019 ] && [ "$yy" -le 2026 ]; then
              mkdir -p "/tmp/source/$yy"
              gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-$yy" -D "/tmp/source/$yy"
            fi
          done
      - run: python research_pure_box_large_abnormal_selloff_portfolio_v1.py --year ${{ matrix.year }} --indir /tmp/source --labels /tmp/mechanism/labeled_candidates.csv.gz --outdir /tmp/portfolio
      - uses: actions/upload-artifact@v4
        with:
          name: abnormal-selloff-portfolio-${{ matrix.year }}
          path: /tmp/portfolio/*
          retention-days: 7

  finalize:
    needs: portfolio
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with: {name: abnormal-selloff-mechanism, path: /tmp/mechanism}
      - uses: actions/download-artifact@v4
        with: {pattern: abnormal-selloff-portfolio-*, path: /tmp/portfolios}
      - run: python research_pure_box_large_abnormal_selloff_finalize_v1.py --mechanism-dir /tmp/mechanism --portfolio-dir /tmp/portfolios --outdir /tmp/final
      - run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/final/summary.json'));c=pd.read_csv('/tmp/final/support_checks.csv');p=pd.read_csv('/tmp/final/portfolio_summary.csv')
          assert d['schema']=='LARGE-ABNORMAL-SELLOFF-V1' and len(d['support'])==6
          assert len(c)==48 and len(p)==112
          print(json.dumps(d['support'],indent=2))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/large_abnormal_selloff_v1
          cp /tmp/mechanism/thresholds.json research/pure_box_liquid_leaders_v1/large_abnormal_selloff_v1/
          cp /tmp/mechanism/mechanism_summary.json research/pure_box_liquid_leaders_v1/large_abnormal_selloff_v1/
          cp /tmp/mechanism/event_quintiles.csv research/pure_box_liquid_leaders_v1/large_abnormal_selloff_v1/
          cp /tmp/mechanism/continuous_summary.csv research/pure_box_liquid_leaders_v1/large_abnormal_selloff_v1/
          cp /tmp/final/summary.json research/pure_box_liquid_leaders_v1/large_abnormal_selloff_v1/
          cp /tmp/final/support_checks.csv research/pure_box_liquid_leaders_v1/large_abnormal_selloff_v1/
          cp /tmp/final/annual_portfolio_results.csv research/pure_box_liquid_leaders_v1/large_abnormal_selloff_v1/
          cp /tmp/final/portfolio_summary.csv research/pure_box_liquid_leaders_v1/large_abnormal_selloff_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/large_abnormal_selloff_v1
          git commit -m 'research: run Large Abnormal Selloff V1' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
