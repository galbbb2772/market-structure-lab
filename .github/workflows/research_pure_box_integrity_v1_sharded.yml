name: Research Pure Box Integrity V1 Sharded

on:
  workflow_dispatch:
  push:
    branches:
      - research/pure-box-long-liquid-leaders-v1
    paths:
      - research_pure_box_integrity_cap.py
      - research_pure_box_integrity_combine.py
      - .github/workflows/research_pure_box_integrity_v1_sharded.yml

permissions:
  contents: write
  actions: read

jobs:
  cap:
    strategy:
      fail-fast: false
      matrix:
        cap: [300, 500]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Download frozen broad-market artifacts
        run: |
          mkdir -p /tmp/pure_box_all
          gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -D /tmp/pure_box_all
      - name: Run cap shard
        run: python research_pure_box_integrity_cap.py --indir /tmp/pure_box_all --outdir /tmp/integrity --cap ${{ matrix.cap }}
      - uses: actions/upload-artifact@v4
        with:
          name: integrity-top${{ matrix.cap }}
          path: /tmp/integrity/*
          retention-days: 7

  combine:
    needs: cap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: integrity-top*
          path: /tmp/shards
      - name: Combine
        run: python research_pure_box_integrity_combine.py --indir /tmp/shards --outdir /tmp/integrity
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/integrity/summary.json'))
          assert d['schema']=='PURE-BOX-INTEGRITY-V1'
          x=pd.read_csv('/tmp/integrity/annual_integrity.csv')
          assert len(x)>=240
          for cap in ('top300','top500'):
              for sleeve in ('fresh','wide_fresh'):
                  assert d['lanes'][cap][sleeve]['all']['years']==6
          print('validated',len(x))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/integrity_v1
          cp /tmp/integrity/* research/pure_box_liquid_leaders_v1/integrity_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/integrity_v1
          if git diff --cached --quiet; then
            echo no-change
          else
            git commit -m 'research: run Pure Box integrity V1 sharded'
            git push
          fi
