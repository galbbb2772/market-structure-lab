name: Research UpDown Divergence Regime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_updown_divergence_regime.py'
      - '.github/workflows/research_updown_divergence_regime.yml'
      - 'docs/data/updown_divergence_oos.json'
      - 'docs/data/structure_lab.json'

concurrency:
  group: updown-divergence-regime
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run post-2020 regime decomposition
        run: python research_updown_divergence_regime.py
      - name: Commit regime-study result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/updown_divergence_regime.json
          git diff --cached --quiet || git commit -m 'data: update divergence regime study'
          git push
