name: Research Pure Box Wide Fresh OOS V1
on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research_pure_box_wide_fresh_oos.py'
      - '.github/workflows/research_pure_box_wide_fresh_oos_v1.yml'
permissions:
  contents: write
  actions: read
jobs:
  oos:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas
      - run: |
          mkdir -p /tmp/pure_box_all
          gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -D /tmp/pure_box_all
      - run: python research_pure_box_wide_fresh_oos.py --indir /tmp/pure_box_all --outdir /tmp/wide_fresh
      - name: Validate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/wide_fresh/summary.json'))
          assert d['schema']=='PURE-BOX-WIDE-FRESH-OOS-V1'
          for c in ('top300','top500'):
              assert d['rank_caps'][c]['validation']['baseline']['trades']>1000
          print(json.dumps(d,indent=2))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/wide_fresh_oos_v1
          cp /tmp/wide_fresh/summary.json research/pure_box_liquid_leaders_v1/wide_fresh_oos_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/wide_fresh_oos_v1
          if git diff --cached --quiet; then echo no-change; else git commit -m 'research: run wide fresh OOS V1' && git push; fi
