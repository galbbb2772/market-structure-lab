name: Sentiment Drift Stage-2 V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_sentiment_drift_stage2_v1.py'
      - 'research/sentiment_drift_stage2_v1/STUDY_SPEC.md'
      - 'docs/data/market_state_box_v1.json'
      - 'research_modules_stage2_v1.py'
      - '.github/workflows/sentiment_drift_stage2_v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run sentiment drift audit
        run: python research_sentiment_drift_stage2_v1.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          p='docs/data/sentiment_drift_stage2_v1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['schema']=='SENTIMENT-DRIFT-STAGE2-V1'
          assert d['research_only'] is True and d['diagnostic_only'] is True
          assert d['production_effect']=='none' and d['thresholds_changed'] is False
          assert d['decision']['may_replace_expanding_percentile'] is False
          assert d['rolling_sensitivity']['expanding80_onsets']['n']==22
          assert d['diagnostic_flags']['no_expanding80_onsets_2022_2026'] is True
          print('SENTIMENT_DRIFT_VALID', d['diagnostic_flags'])
          PY
      - name: Commit research data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/sentiment_drift_stage2_v1.json
          if git diff --cached --quiet; then
            echo 'No sentiment drift data change.'
          else
            git commit -m 'data: refresh sentiment drift Stage-2 V1'
            git pull --rebase origin main
            git push
          fi
