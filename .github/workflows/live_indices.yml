name: Refresh Live Index Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 13-21 * * 1-5'
    - cron: '0 22 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'build_live_indices.py'
      - '.github/workflows/live_indices.yml'
      - 'docs/ratio-history.html'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  live:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install live dependency
        run: python -m pip install requests

      - name: Build live three-index snapshot
        run: python build_live_indices.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload live site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy live site
        id: deployment
        uses: actions/deploy-pages@v4
