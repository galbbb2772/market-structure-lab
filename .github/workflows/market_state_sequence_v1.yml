name: Refresh Market State Sequence V1

on:
  workflow_dispatch:
  schedule:
    - cron: '10 4 * * 2-6'
  push:
    branches: [main]
    paths:
      - 'build_market_state_sequence_v1.py'
      - 'build_market_state_sequence_event_audit_v1.py'
      - 'diagnose_market_state_sequence_freshness_v1.py'
      - 'build_residual_mean_reversion_distance_v1.py'
      - 'build_residual_mean_reversion_distance_forward_oos_v1.py'
      - 'validate_market_state_sequence_phase_onsets_v1.py'
      - 'research_task14_extended_v1.py'
      - 'research/market_state_sequence_v1/PREREGISTRATION.md'
      - 'research/market_state_sequence_v1/EVENT_AUDIT_PREREGISTRATION.md'
      - 'research/market_state_sequence_freshness_v1/PREREGISTRATION.md'
      - 'research/residual_mean_reversion_distance_v1/PREREGISTRATION.md'
      - 'research/residual_mean_reversion_distance_forward_oos_v1/PREREGISTRATION.md'
      - '.github/workflows/market_state_sequence_v1.yml'

permissions:
  contents: write

concurrency:
  group: market-state-sequence-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build preregistered sequence study
        run: python build_market_state_sequence_v1.py
      - name: Run non-overlap phase-onset robustness check
        run: python validate_market_state_sequence_phase_onsets_v1.py
      - name: Run event-by-event audit and observation-only OOS shadow
        run: python build_market_state_sequence_event_audit_v1.py
      - name: Run Sequence Freshness / second-drop diagnostic
        run: python diagnose_market_state_sequence_freshness_v1.py
      - name: Run Residual Mean-Reversion Distance diagnostic
        run: python build_residual_mean_reversion_distance_v1.py
      - name: Run Task 1/4 extended diagnostics
        run: python research_task14_extended_v1.py
      - name: Update append-only RMD3 Forward OOS ledger
        run: python build_residual_mean_reversion_distance_forward_oos_v1.py
      - name: Validate frozen research output
        run: |
          python - <<'PY'
          import json
          p='docs/data/market_state_sequence_v1.json'
          q='docs/data/market_state_sequence_phase_onsets_v1.json'
          a='docs/data/market_state_sequence_event_audit_v1.json'
          o='docs/data/market_state_sequence_forward_oos_v1.json'
          f='docs/data/market_state_sequence_freshness_v1.json'
          m='docs/data/residual_mean_reversion_distance_v1.json'
          g='docs/data/residual_mean_reversion_distance_forward_oos_v1.json'
          t='docs/data/task14_extended_diagnostics_v1.json'
          d=json.load(open(p,encoding='utf-8'))
          z=json.load(open(q,encoding='utf-8'))
          x=json.load(open(a,encoding='utf-8'))
          s=json.load(open(o,encoding='utf-8'))
          r=json.load(open(f,encoding='utf-8'))
          u=json.load(open(m,encoding='utf-8'))
          v=json.load(open(g,encoding='utf-8'))
          w=json.load(open(t,encoding='utf-8'))
          assert d['schema']=='MARKET-STATE-SEQUENCE-V1'
          assert d['research_only'] is True
          assert d['preregistered'] is True
          assert d['coverage']['observations'] > 2000
          assert d['coverage']['usable_10d'] > 1500
          assert d['frozen_definitions']['breadth_low_pct']==20.0
          assert d['frozen_definitions']['box_bottom_position']==0.25
          for seg in ('full','pre_2022','post_2022','recent_2024'):
              assert seg in d['phase_stats']
              assert seg in d['sequence_onset_stats']
              for flag in ('D_TO_BREADTH_LOW','D_TO_BREADTH_REBOUND','D_TO_BOX_BOTTOM','D_TO_REBOUND_SCORE','D_TO_BOTH_REBOUND_SCORE'):
                  assert flag in d['sequence_onset_stats'][seg]
          assert z['schema']=='MARKET-STATE-SEQUENCE-PHASE-ONSETS-V1'
          assert z['thresholds_changed'] is False
          assert 'active_d11plus' in z['phase_onset_stats']['full']
          assert x['schema']=='MARKET-STATE-SEQUENCE-EVENT-AUDIT-V1'
          assert x['thresholds_changed'] is False
          assert x['event_count']==12
          assert len(x['events'])==12
          assert s['schema']=='MARKET-STATE-SEQUENCE-FORWARD-OOS-V1'
          assert s['observation_only'] is True
          assert s['production_effect']=='none'
          assert r['schema']=='MARKET-STATE-SEQUENCE-FRESHNESS-V1'
          assert r['research_only'] is True and r['diagnostic_only'] is True
          assert r['thresholds_changed'] is False
          assert r['event_count']==12
          assert r['decision']['may_change_production'] is False
          assert r['decision']['may_change_existing_forward_oos_shadow'] is False
          assert u['schema']=='RESIDUAL-MEAN-REVERSION-DISTANCE-V1'
          assert u['event_count']==12
          assert u['thresholds_or_weights_optimized'] is False
          assert u['production_effect']=='none'
          assert u['decision']['may_change_production'] is False
          assert u['decision']['may_change_existing_forward_oos_shadow'] is False
          assert len(u['events_ranked_by_rmd3'])==12
          assert v['schema']=='RMD3-SEQUENCE-FORWARD-OOS-V1'
          assert v['observation_only'] is True
          assert v['production_effect']=='none'
          assert v['freeze_reference_commit']=='14283ffc5c5f41156a580d4731d4c3b79d800246'
          assert v['frozen_through_market_date']=='2026-10-02'
          assert v['event_definition']=='D_TO_BOTH_REBOUND_SCORE'
          assert v['score_definition']=='RMD3 = equal-weight mean(price_residual, breadth_residual, score_residual)'
          for e in v['events']:
              assert e['event_date'] > '2026-10-02'
              assert 0.0 <= e['rmd3'] <= 1.0
          assert w['schema']=='TASK14-EXTENDED-DIAGNOSTICS-V1'
          assert w['research_only'] is True and w['diagnostic_only'] is True
          assert w['production_effect']=='none'
          assert w['thresholds_changed'] is False
          assert w['coverage']['observations'] > 2000
          assert w['recovery_velocity']['frozen_event_count']==12
          for key in ('sequence_ablation','failure_paths','rmd_component_ablation','freshness_decay','second_leg_hazard','state_transition_matrix'):
              assert key in w
          assert w['decision']['may_change_production'] is False
          print('MARKET_STATE_SEQUENCE_V1_VALID', d['coverage'], d['latest'], x['shadow_decision'])
          print('SEQUENCE_FRESHNESS_V1_VALID', r['full_summary'], r['concentration'])
          print('RESIDUAL_MEAN_REVERSION_DISTANCE_V1_VALID', u['correlations'])
          print('TASK14_EXTENDED_V1_VALID', w['coverage'], {k:v['stats']['n'] for k,v in w['sequence_ablation'].items()}, w['failure_paths']['class_counts'])
          print('RMD3_FORWARD_OOS_VALID', v['forward_event_count'], v['mature_10d_event_count'], v['source_recompute_discrepancies'])
          PY
      - name: Commit refreshed research data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/market_state_sequence_v1.json docs/data/market_state_sequence_phase_onsets_v1.json docs/data/market_state_sequence_event_audit_v1.json docs/data/market_state_sequence_forward_oos_v1.json docs/data/market_state_sequence_freshness_v1.json docs/data/residual_mean_reversion_distance_v1.json docs/data/residual_mean_reversion_distance_forward_oos_v1.json docs/data/task14_extended_diagnostics_v1.json
          if git diff --cached --quiet; then
            echo 'No dataset change.'
          else
            git commit -m 'data: refresh Market State Sequence V1'
            git pull --rebase origin main
            git push
          fi
