name: Research Large Box Market Permission V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/pure-box-long-liquid-leaders-v1
    paths:
      - 'research/pure_box_liquid_leaders_v1/large_market_permission_v1/PREREGISTRATION.md'
      - 'research_pure_box_large_market_permission_year_v1.py'
      - 'research_pure_box_large_market_permission_combine_v1.py'
      - '.github/workflows/research_large_market_permission_v1.yml'

permissions:
  contents: write
  actions: read

jobs:
  year:
    strategy:
      fail-fast: false
      matrix:
        year: [2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Download adjacent-year Pure Box artifacts
        run: |
          mkdir -p /tmp/source
          y=${{ matrix.year }}
          for yy in $((y-1)) $y $((y+1)); do
            if [ "$yy" -ge 2019 ] && [ "$yy" -le 2026 ]; then
              mkdir -p "/tmp/source/$yy"
              gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-$yy" -D "/tmp/source/$yy"
            fi
          done
      - name: Run regime shard
        run: |
          python research_pure_box_large_market_permission_year_v1.py             --year ${{ matrix.year }}             --indir /tmp/source             --outdir /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: large-market-permission-${{ matrix.year }}
          path: /tmp/result/*
          retention-days: 7

  combine:
    needs: year
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: large-market-permission-*
          path: /tmp/shards
      - name: Combine
        run: |
          python research_pure_box_large_market_permission_combine_v1.py             --indir /tmp/shards             --outdir /tmp/result
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/result/summary.json'))
          assert d['schema']=='LARGE-MARKET-PERMISSION-V1'
          e=pd.read_csv('/tmp/result/event_state_summary.csv')
          p=pd.read_csv('/tmp/result/portfolio_state_summary.csv')
          s=pd.read_csv('/tmp/result/mechanism_screen.csv')
          assert len(e)>100
          assert len(p)>200
          assert len(s)>50
          for cap in (300,500):
              assert ((e.rank_cap==cap)&(e.target_fraction==0.6)).any()
              assert ((e.rank_cap==cap)&(e.target_fraction==0.8)).any()
          print('validated',len(e),len(p),len(s))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/large_market_permission_v1
          cp /tmp/result/summary.json research/pure_box_liquid_leaders_v1/large_market_permission_v1/
          cp /tmp/result/annual_event_state_stats.csv research/pure_box_liquid_leaders_v1/large_market_permission_v1/
          cp /tmp/result/annual_portfolio_state_stats.csv research/pure_box_liquid_leaders_v1/large_market_permission_v1/
          cp /tmp/result/event_state_summary.csv research/pure_box_liquid_leaders_v1/large_market_permission_v1/
          cp /tmp/result/portfolio_state_summary.csv research/pure_box_liquid_leaders_v1/large_market_permission_v1/
          cp /tmp/result/mechanism_screen.csv research/pure_box_liquid_leaders_v1/large_market_permission_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/large_market_permission_v1
          if git diff --cached --quiet; then
            echo no-change
          else
            git commit -m 'research: run Large Box Market Permission V1'
            git fetch origin research/pure-box-long-liquid-leaders-v1
            git rebase origin/research/pure-box-long-liquid-leaders-v1
            git push
          fi
