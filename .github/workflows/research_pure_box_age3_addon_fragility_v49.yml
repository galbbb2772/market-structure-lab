name: Research Pure Box Age-3 Add-On Fragility V49
on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/age3_addon_fragility_v49/PREREGISTRATION.md'
      - 'research_pure_box_age3_addon_fragility_v49.py'
      - '.github/workflows/research_pure_box_age3_addon_fragility_v49.yml'
permissions: {contents: write, actions: read}
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas
      - run: |
          mkdir -p /tmp/source
          gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -D /tmp/source
      - run: python research_pure_box_age3_addon_fragility_v49.py --indir /tmp/source --outdir /tmp/result
      - name: Validate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/result/summary.json'))
          assert d['schema']=='PURE-BOX-SIMPLE-CORE-AGE3-ADDON-FRAGILITY-V49'
          print(json.dumps(d,indent=2))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/age3_addon_fragility_v49
          cp /tmp/result/* research/pure_box_liquid_leaders_v1/age3_addon_fragility_v49/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/age3_addon_fragility_v49
          git commit -m 'research: run Pure Box Age-3 Add-On Fragility V49' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
