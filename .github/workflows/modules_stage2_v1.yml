name: Cross Module Stage-2 V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_modules_stage2_v1.py'
      - 'research/modules_stage2_v1/STUDY_SPEC.md'
      - 'docs/data/market_state_box_v1.json'
      - 'docs/data/structure_lab.json'
      - 'docs/data/updown_divergence_regime_gate_robust.json'
      - '.github/workflows/modules_stage2_v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run cross-module Stage-2 validation
        run: python research_modules_stage2_v1.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          p='docs/data/modules_stage2_v1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['schema']=='CROSS-MODULE-STAGE2-V1'
          assert d['research_only'] is True and d['diagnostic_only'] is True
          assert d['production_effect']=='none' and d['thresholds_changed'] is False
          for k in ('box','sentiment','breadth','score','concentration'):
              assert k in d
          assert d['decision']['may_change_production'] is False
          assert d['decision']['may_select_best_threshold_from_grid'] is False
          assert len(d['box']['stability_grid'])==3
          assert len(d['sentiment']['stability_grid'])==3
          assert len(d['breadth']['stability_grid'])==3
          assert len(d['score']['stability_grid'])==3
          print('CROSS_MODULE_STAGE2_VALID', {
              'box_n': d['box']['center']['n'],
              'sentiment_n': d['sentiment']['center']['n'],
              'breadth_n': d['breadth']['center']['n'],
              'score_n': d['score']['center']['n'],
              'concentration_symbols': [x['symbol'] for x in d['concentration']['results']],
          })
          PY
      - name: Commit research data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/modules_stage2_v1.json
          if git diff --cached --quiet; then
            echo 'No cross-module Stage-2 data change.'
          else
            git commit -m 'data: refresh cross-module Stage-2 V1'
            git pull --rebase origin main
            git push
          fi
