name: Research Retest-Lift Capital Utilization V11

on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/large_gap_retest_lift_capital_utilization_v11/PREREGISTRATION.md'
      - 'research_pure_box_large_gap_retest_lift_capital_utilization_v11.py'
      - '.github/workflows/research_large_gap_retest_lift_capital_utilization_v11.yml'

permissions:
  contents: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ANATOMY_RUN: 37573754734
      RESILIENCE_RUN: 37558533895
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - name: Download frozen labels and source
        run: |
          mkdir -p /tmp/anatomy /tmp/resilience /tmp/source
          gh run download "$ANATOMY_RUN" -R "${{ github.repository }}" -n selloff-anatomy-mechanism -D /tmp/anatomy
          gh run download "$RESILIENCE_RUN" -R "${{ github.repository }}" -n relative-resilience-mechanism -D /tmp/resilience
          for y in 2019 2020 2021 2022 2023 2024 2025 2026; do
            mkdir -p "/tmp/source/$y"
            gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-$y" -D "/tmp/source/$y"
          done
      - name: Run sizing grid
        run: |
          python research_pure_box_large_gap_retest_lift_capital_utilization_v11.py \
            --anatomy-labels /tmp/anatomy/labeled_candidates.csv.gz \
            --resilience-labels /tmp/resilience/labeled_candidates.csv.gz \
            --thresholds research/pure_box_liquid_leaders_v1/large_gap_retest_lift_v7/thresholds_by_year.csv \
            --source-dir /tmp/source \
            --outdir /tmp/result
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/result/summary.json'))
          r=pd.read_csv('/tmp/result/capital_utilization_results.csv')
          assert d['schema']=='LARGE-GAP-RETEST-LIFT-CAPITAL-UTILIZATION-V11'
          assert len(r)==10
          assert sorted(r['allocation_per_event'].unique().tolist())==[0.1,0.2,0.25,0.33,0.5]
          print(r[['allocation_per_event','target_fraction','total_return','max_drawdown','daily_sharpe','avg_exposure']].to_string(index=False))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/large_gap_retest_lift_capital_utilization_v11
          cp /tmp/result/* research/pure_box_liquid_leaders_v1/large_gap_retest_lift_capital_utilization_v11/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/large_gap_retest_lift_capital_utilization_v11
          git commit -m 'research: run Retest-Lift capital utilization V11' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
