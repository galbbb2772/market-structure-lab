name: Research Large Resilience Exhaustion V2

on:
  workflow_dispatch:
  push:
    branches:
      - research/pure-box-long-liquid-leaders-v1
    paths:
      - 'research/pure_box_liquid_leaders_v1/large_resilience_exhaustion_v2/PREREGISTRATION.md'
      - 'research_pure_box_large_resilience_exhaustion_year_v2.py'
      - 'research_pure_box_large_resilience_exhaustion_combine_v2.py'
      - '.github/workflows/research_large_resilience_exhaustion_v2.yml'

permissions:
  contents: write
  actions: read

jobs:
  year:
    strategy:
      fail-fast: false
      matrix:
        year: [2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Download adjacent-year Pure Box artifacts
        run: |
          mkdir -p /tmp/source
          y=${{ matrix.year }}
          for yy in $((y-1)) $y $((y+1)); do
            if [ "$yy" -ge 2019 ] && [ "$yy" -le 2026 ]; then
              mkdir -p "/tmp/source/$yy"
              gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-$yy" -D "/tmp/source/$yy"
            fi
          done
      - name: Run resilience-exhaustion shard
        run: |
          python research_pure_box_large_resilience_exhaustion_year_v2.py             --year ${{ matrix.year }}             --indir /tmp/source             --outdir /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: large-resilience-exhaustion-${{ matrix.year }}
          path: /tmp/result/*
          retention-days: 7

  combine:
    needs: year
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: large-resilience-exhaustion-*
          path: /tmp/shards
      - run: |
          python research_pure_box_large_resilience_exhaustion_combine_v2.py             --indir /tmp/shards             --outdir /tmp/result
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/result/summary.json'))
          assert d['schema']=='LARGE-RESILIENCE-EXHAUSTION-V2'
          c=pd.read_csv('/tmp/result/cell_summary.csv')
          k=pd.read_csv('/tmp/result/contrast_summary.csv')
          assert len(c)>=24
          assert len(k)>=24
          for cap in ('top300','top500'):
              for t in ('t60','t80'):
                  assert 'discovery' in d['cells'][cap][t]
                  assert 'validation' in d['cells'][cap][t]
                  assert 'joint_best_vs_worst' in d['contrasts'][cap][t]['validation']
          print('validated',len(c),len(k))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/large_resilience_exhaustion_v2
          cp /tmp/result/summary.json research/pure_box_liquid_leaders_v1/large_resilience_exhaustion_v2/
          cp /tmp/result/cell_summary.csv research/pure_box_liquid_leaders_v1/large_resilience_exhaustion_v2/
          cp /tmp/result/contrast_summary.csv research/pure_box_liquid_leaders_v1/large_resilience_exhaustion_v2/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/large_resilience_exhaustion_v2
          if git diff --cached --quiet; then
            echo no-change
          else
            git commit -m 'research: run Large Resilience x Exhaustion V2'
            git fetch origin research/pure-box-long-liquid-leaders-v1
            git rebase origin/research/pure-box-long-liquid-leaders-v1
            git push
          fi
