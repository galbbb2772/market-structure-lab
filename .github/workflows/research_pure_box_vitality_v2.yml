name: Research Pure Box Vitality V2
on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/vitality_v2/PREREGISTRATION.md'
      - 'research_pure_box_vitality_v2.py'
      - '.github/workflows/research_pure_box_vitality_v2.yml'
permissions:
  contents: write
  actions: read
jobs:
  vitality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - run: |
          mkdir -p /tmp/pure_box_all
          gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -D /tmp/pure_box_all
      - run: python research_pure_box_vitality_v2.py --indir /tmp/pure_box_all --outdir /tmp/vitality
      - name: Validate
        run: |
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open('/tmp/vitality/summary.json'))
          assert d['schema']=='PURE-BOX-VITALITY-V2'
          g=pd.read_csv('/tmp/vitality/validation_width_age_grid.csv')
          w=pd.read_csv('/tmp/vitality/annual_walk_forward.csv')
          assert len(g)>50 and len(w)>20
          for cap in ('top300','top500'):
              assert d['rank_caps'][cap]['validation_baseline']['trades']>1000
          print(w.groupby(['rank_cap','lane']).agg({'total_return':'mean','sharpe':'mean','trades':'sum'}))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/vitality_v2
          cp /tmp/vitality/summary.json research/pure_box_liquid_leaders_v1/vitality_v2/
          cp /tmp/vitality/validation_width_age_grid.csv research/pure_box_liquid_leaders_v1/vitality_v2/
          cp /tmp/vitality/annual_walk_forward.csv research/pure_box_liquid_leaders_v1/vitality_v2/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/vitality_v2
          if git diff --cached --quiet; then echo no-change; else git commit -m 'research: run Pure Box vitality V2' && git push; fi
