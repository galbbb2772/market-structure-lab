name: Backtest UpDown Index V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backtest_updown_index_v2.py'
      - '.github/workflows/backtest_updown_index_v2.yml'
      - 'docs/data/structure_lab.json'

permissions:
  contents: write

concurrency:
  group: backtest-updown-index-v2
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run index-only V2 backtest
        run: python backtest_updown_index_v2.py

      - name: Commit V2 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/updown_index_backtest_v2.json
          if git diff --cached --quiet; then
            echo "No V2 result changes"
          else
            git commit -m "data: update index-only up/down V2 backtest"
            git push
          fi
