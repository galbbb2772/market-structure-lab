name: Diagnose Market State Box V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'diagnose_market_state_box_v2.py'
      - '.github/workflows/market_state_box_v2_diagnostics.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run feature-set diagnostics
        run: python diagnose_market_state_box_v2.py
      - name: Validate diagnostic output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/data/market_state_box_v2_diagnostics.json').read_text(encoding='utf-8'))
          assert d.get('diagnostic_only') is True
          assert 'full_8d' in d.get('results',{})
          assert 'box_breadth_level' in d.get('results',{})
          print(json.dumps(d['results'],ensure_ascii=False))
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/market_state_box_v2_diagnostics.json
          if git diff --cached --quiet; then
            echo 'No diagnostic change.'
          else
            git commit -m 'data: refresh Market State Box V2 diagnostics'
            git push
          fi
