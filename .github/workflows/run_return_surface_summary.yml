name: Summarize Return Surface

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'summarize_return_surface.py'
      - '.github/workflows/run_return_surface_summary.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact surface summary
        run: python summarize_return_surface.py
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/return_surface_summary.json
          if git diff --cached --quiet; then
            echo "No summary changes"
          else
            git commit -m "data: summarize conditional return surface"
            git pull --rebase origin main
            git push
          fi
