name: Run Retest Robustness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_retest_robustness.py'
      - '.github/workflows/run_retest_robustness.yml'

permissions:
  contents: write

concurrency:
  group: retest-robustness
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run robustness analysis
        run: python research_retest_robustness.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/retest_robustness.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "data: refresh retest robustness"
            git pull --rebase origin main
            git push
          fi
