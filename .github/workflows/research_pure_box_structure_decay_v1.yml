name: Research Structure Decay V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/pure-box-long-liquid-leaders-v1
    paths:
      - 'research/pure_box_liquid_leaders_v1/structure_decay_v1/PREREGISTRATION.md'
      - 'research_pure_box_structure_decay_year.py'
      - 'research_pure_box_structure_decay_combine.py'
      - '.github/workflows/research_pure_box_structure_decay_v1.yml'

permissions:
  contents: write
  actions: read

jobs:
  year:
    strategy:
      fail-fast: false
      matrix:
        year: [2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Download frozen yearly artifact
        run: |
          mkdir -p /tmp/source
          gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-${{ matrix.year }}" -D /tmp/source
      - name: Run yearly decay extraction
        run: |
          python research_pure_box_structure_decay_year.py             --year ${{ matrix.year }}             --indir /tmp/source             --outdir /tmp/decay
      - uses: actions/upload-artifact@v4
        with:
          name: structure-decay-${{ matrix.year }}
          path: /tmp/decay/*
          retention-days: 7

  combine:
    needs: year
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: structure-decay-*
          path: /tmp/shards
      - name: Combine
        run: |
          python research_pure_box_structure_decay_combine.py             --indir /tmp/shards             --outdir /tmp/decay
      - name: Validate
        run: |
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open('/tmp/decay/summary.json'))
          assert d['schema']=='STRUCTURE-DECAY-V1'
          x=pd.read_csv('/tmp/decay/decay_bins.csv')
          assert len(x)>100
          y=pd.read_csv('/tmp/decay/yearly_episode_bins.csv')
          assert set(y['year'])=={2019,2020,2021,2022,2023,2024,2025,2026}
          for cap in ('top300','top500'):
              assert d['validation_episode_receipt'][cap]['fresh']['1']['n']>100
          print('validated', len(x), len(y))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/structure_decay_v1
          cp /tmp/decay/summary.json research/pure_box_liquid_leaders_v1/structure_decay_v1/
          cp /tmp/decay/decay_bins.csv research/pure_box_liquid_leaders_v1/structure_decay_v1/
          cp /tmp/decay/yearly_episode_bins.csv research/pure_box_liquid_leaders_v1/structure_decay_v1/
          cp /tmp/decay/episode_observations.csv.gz research/pure_box_liquid_leaders_v1/structure_decay_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/structure_decay_v1
          if git diff --cached --quiet; then
            echo no-change
          else
            git commit -m 'research: run Structure Decay V1'
            git push
          fi
