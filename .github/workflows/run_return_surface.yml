name: Run Conditional Return Surface

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_return_surface.py'
      - '.github/workflows/run_return_surface.yml'

permissions:
  contents: write

concurrency:
  group: return-surface
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run return surface analysis
        run: python research_return_surface.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/return_surface.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "data: refresh conditional return surface"
            git pull --rebase origin main
            git push
          fi
