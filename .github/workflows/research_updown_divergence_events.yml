name: Research UpDown Divergence Events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_updown_divergence_events.py'
      - '.github/workflows/research_updown_divergence_events.yml'
      - 'docs/data/structure_lab.json'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run divergence event study
        run: python research_updown_divergence_events.py
      - name: Commit event-study result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/updown_divergence_event_study.json
          git diff --cached --quiet || git commit -m 'data: update updown divergence event study'
          git push
