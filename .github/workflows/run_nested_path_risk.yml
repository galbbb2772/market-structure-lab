name: Run Nested Path Risk

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_nested_path_risk.py'
      - '.github/workflows/run_nested_path_risk.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy
        run: python -m pip install 'numpy>=2.0'
      - name: Run path/risk validation
        run: python research_nested_path_risk.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/nested_path_risk.json
          if git diff --cached --quiet; then
            echo "No path-risk changes"
          else
            git commit -m "data: update nested path and risk validation"
            git pull --rebase origin main
            git push
          fi
