name: Research Structure Decay V1.3 Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/pure-box-long-liquid-leaders-v1
    paths:
      - 'research/pure_box_liquid_leaders_v1/structure_decay_v1_3_audit/PREREGISTRATION.md'
      - 'research_pure_box_structure_decay_year_v1_3.py'
      - 'research_pure_box_structure_decay_combine_v1_3.py'
      - '.github/workflows/research_pure_box_structure_decay_v1_3_audit.yml'

permissions:
  contents: write
  actions: read

jobs:
  year:
    strategy:
      fail-fast: false
      matrix:
        year: [2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Download adjacent-year artifacts
        run: |
          mkdir -p /tmp/source
          y=${{ matrix.year }}
          for yy in $((y-1)) $y $((y+1)); do
            if [ "$yy" -ge 2019 ] && [ "$yy" -le 2026 ]; then
              mkdir -p "/tmp/source/$yy"
              gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-$yy" -D "/tmp/source/$yy"
            fi
          done
      - name: Run audited yearly extraction
        run: |
          python research_pure_box_structure_decay_year_v1_3.py             --year ${{ matrix.year }}             --indir /tmp/source             --outdir /tmp/decay
      - uses: actions/upload-artifact@v4
        with:
          name: structure-decay-audit-${{ matrix.year }}
          path: /tmp/decay/*
          retention-days: 7

  combine:
    needs: year
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: structure-decay-audit-*
          path: /tmp/shards
      - name: Combine audit
        run: |
          python research_pure_box_structure_decay_combine_v1_3.py             --indir /tmp/shards             --outdir /tmp/decay
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/decay/summary.json'))
          assert d['schema']=='STRUCTURE-DECAY-V1.3-AUDIT'
          x=pd.read_csv('/tmp/decay/audit_decay_bins.csv')
          assert len(x)>30
          assert d['coverage']['history_complete']>10000
          print(json.dumps({
              'coverage':d['coverage'],
              'top500_validation_fresh':d['cliff_receipt']['top500']['validation']['fresh'],
              'top500_validation_wide_fresh':d['cliff_receipt']['top500']['validation']['wide_fresh'],
          },indent=2))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/structure_decay_v1_3_audit
          cp /tmp/decay/* research/pure_box_liquid_leaders_v1/structure_decay_v1_3_audit/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/structure_decay_v1_3_audit
          if git diff --cached --quiet; then
            echo no-change
          else
            git commit -m 'research: run Structure Decay V1.3 audit'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
