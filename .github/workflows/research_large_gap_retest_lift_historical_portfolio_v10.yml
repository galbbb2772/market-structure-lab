name: Research Large Gap Retest-Lift Historical Portfolio V10

on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/large_gap_retest_lift_historical_portfolio_v10/PREREGISTRATION.md'
      - 'research_pure_box_large_gap_retest_lift_historical_portfolio_v10.py'
      - '.github/workflows/research_large_gap_retest_lift_historical_portfolio_v10.yml'

permissions:
  contents: write
  actions: read

jobs:
  portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ANATOMY_RUN: 37573754734
      RESILIENCE_RUN: 37558533895
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - name: Download frozen labels and full source window
        run: |
          mkdir -p /tmp/anatomy /tmp/resilience /tmp/source
          gh run download "$ANATOMY_RUN" -R "${{ github.repository }}" -n selloff-anatomy-mechanism -D /tmp/anatomy
          gh run download "$RESILIENCE_RUN" -R "${{ github.repository }}" -n relative-resilience-mechanism -D /tmp/resilience
          for y in 2019 2020 2021 2022 2023 2024 2025 2026; do
            mkdir -p "/tmp/source/$y"
            gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-$y" -D "/tmp/source/$y"
          done
      - name: Run continuous historical portfolio replay
        run: |
          python research_pure_box_large_gap_retest_lift_historical_portfolio_v10.py \
            --anatomy-labels /tmp/anatomy/labeled_candidates.csv.gz \
            --resilience-labels /tmp/resilience/labeled_candidates.csv.gz \
            --thresholds research/pure_box_liquid_leaders_v1/large_gap_retest_lift_v7/thresholds_by_year.csv \
            --source-dir /tmp/source \
            --outdir /tmp/result
      - name: Validate
        run: |
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open('/tmp/result/summary.json'))
          r=pd.read_csv('/tmp/result/portfolio_results.csv')
          assert d['schema']=='LARGE-GAP-RETEST-LIFT-HISTORICAL-PORTFOLIO-V10'
          assert len(r)==24
          assert d['portfolio_contract']['year_boundary']=='continuous_no_forced_reset'
          for k in [
            'top500__EXPANDING__RETEST_LIFT__t60',
            'top500__EXPANDING__RETEST_LIFT__t80',
            'top500__FIXED_-1PCT__RETEST_LIFT__t60',
            'top500__FIXED_-1PCT__RETEST_LIFT__t80',
          ]:
            assert k in d['lanes']
          print(json.dumps({k:d['lanes'][k] for k in d['lanes'] if 'top500__EXPANDING__RETEST_LIFT' in k}, indent=2))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/large_gap_retest_lift_historical_portfolio_v10
          cp /tmp/result/* research/pure_box_liquid_leaders_v1/large_gap_retest_lift_historical_portfolio_v10/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/large_gap_retest_lift_historical_portfolio_v10
          git commit -m 'research: run Retest-Lift historical portfolio V10' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
