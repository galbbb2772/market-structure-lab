name: Research Pure Box Position Sizing V2

on:
  workflow_dispatch:
  push:
    branches:
      - research/pure-box-long-liquid-leaders-v1
    paths:
      - 'research/pure_box_liquid_leaders_v1/position_sizing_v2/PREREGISTRATION.md'
      - 'research_pure_box_position_sizing_year_v2.py'
      - 'research_pure_box_position_sizing_combine_v2.py'
      - '.github/workflows/research_pure_box_position_sizing_v2.yml'

permissions:
  contents: write
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        year: [2021,2022,2023,2024,2025,2026]
        cap: [300,500]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - name: Download adjacent-year source
        run: |
          mkdir -p /tmp/source
          y=${{ matrix.year }}
          for yy in $((y-1)) $y $((y+1)); do
            if [ "$yy" -ge 2019 ] && [ "$yy" -le 2026 ]; then
              mkdir -p "/tmp/source/$yy"
              gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-$yy" -D "/tmp/source/$yy"
            fi
          done
      - name: Run sizing audit shard
        run: |
          python research_pure_box_position_sizing_year_v2.py             --year ${{ matrix.year }}             --cap ${{ matrix.cap }}             --indir /tmp/source             --outdir /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: position-sizing-v2-${{ matrix.cap }}-${{ matrix.year }}
          path: /tmp/result/*
          retention-days: 7

  combine:
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: position-sizing-v2-*
          path: /tmp/shards
      - run: python research_pure_box_position_sizing_combine_v2.py --indir /tmp/shards --outdir /tmp/result
      - name: Validate and persist
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/result/summary.json'))
          assert d['schema']=='PURE-BOX-POSITION-SIZING-V2'
          x=pd.read_csv('/tmp/result/annual_results.csv')
          assert len(x)==432
          for cap in ('top300','top500'):
              for sleeve in ('fresh','wide_fresh'):
                  assert d['lanes'][cap][sleeve]
          print('validated',len(x))
          PY
          mkdir -p research/pure_box_liquid_leaders_v1/position_sizing_v2
          cp /tmp/result/summary.json research/pure_box_liquid_leaders_v1/position_sizing_v2/
          cp /tmp/result/annual_results.csv research/pure_box_liquid_leaders_v1/position_sizing_v2/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/position_sizing_v2
          if git diff --cached --quiet; then
            echo no-change
          else
            git commit -m 'research: run Position Sizing V2 concentration audit'
            git fetch origin research/pure-box-long-liquid-leaders-v1
            git rebase origin/research/pure-box-long-liquid-leaders-v1
            git push
          fi
