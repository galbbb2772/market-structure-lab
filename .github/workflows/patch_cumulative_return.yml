name: Patch Cumulative Return Chart

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patch_cumulative_index_return.py'
      - '.github/workflows/patch_cumulative_return.yml'

permissions:
  contents: write

concurrency:
  group: patch-cumulative-return
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch cumulative return chart
        run: python patch_cumulative_index_return.py
      - name: Commit patched page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ratio-history.html
          git diff --cached --quiet || git commit -m 'feat: show cumulative index return from selected range start'
          git push
