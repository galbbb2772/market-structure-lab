name: Patch Entry Gate Panel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patch_entry_gate_panel.py'
      - '.github/workflows/patch_entry_gate_panel.yml'

concurrency:
  group: patch-entry-gate-panel
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Entry Gate patch
        run: python patch_entry_gate_panel.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ratio-history.html
          git diff --cached --quiet || git commit -m 'feat: add entry gate operation panel'
          git pull --rebase origin main
          git push
