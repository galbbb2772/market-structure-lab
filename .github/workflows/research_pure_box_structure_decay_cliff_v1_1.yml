name: Research Structure Decay Cliff V1.1
on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/structure_decay_v1/cliff_v1_1/PREREGISTRATION.md'
      - 'research_pure_box_structure_decay_cliff_v1_1.py'
      - '.github/workflows/research_pure_box_structure_decay_cliff_v1_1.yml'
permissions:
  contents: write
jobs:
  cliff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - run: python research_pure_box_structure_decay_cliff_v1_1.py
      - name: Validate and persist
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('research/pure_box_liquid_leaders_v1/structure_decay_v1/cliff_v1_1/summary.json'))
          assert d['schema']=='STRUCTURE-DECAY-CLIFF-V1.1'
          r=pd.read_csv('research/pure_box_liquid_leaders_v1/structure_decay_v1/cliff_v1_1/receipt.csv')
          assert len(r)==12
          print(r.to_string(index=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/structure_decay_v1/cliff_v1_1
          if git diff --cached --quiet; then echo no-change; else git commit -m 'research: run Structure Decay cliff V1.1' && git push; fi
