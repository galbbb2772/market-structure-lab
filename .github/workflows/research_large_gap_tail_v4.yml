name: Research Large Gap Tail Exclusion V4

on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/large_gap_tail_exclusion_v4/PREREGISTRATION.md'
      - 'research_pure_box_large_gap_tail_prepare_v4.py'
      - 'research_pure_box_large_gap_tail_year_v4.py'
      - 'research_pure_box_large_gap_tail_combine_v4.py'
      - '.github/workflows/research_large_gap_tail_v4.yml'

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ANATOMY_RUN: 37573754734
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas
      - name: Download Anatomy V2 mechanism artifact
        run: |
          mkdir -p /tmp/anatomy
          gh run download "$ANATOMY_RUN" -R "${{ github.repository }}" -n selloff-anatomy-mechanism -D /tmp/anatomy
      - run: python research_pure_box_large_gap_tail_prepare_v4.py --labels /tmp/anatomy/labeled_candidates.csv.gz --outdir /tmp/prep
      - uses: actions/upload-artifact@v4
        with:
          name: gap-tail-prepared
          path: /tmp/prep/*
          retention-days: 7

  year:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        year: [2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with: {name: gap-tail-prepared, path: /tmp/prep}
      - name: Download adjacent-year source
        run: |
          mkdir -p /tmp/source
          y=${{ matrix.year }}
          for yy in $((y-1)) $y $((y+1)); do
            if [ "$yy" -ge 2019 ] && [ "$yy" -le 2026 ]; then
              mkdir -p "/tmp/source/$yy"
              gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-$yy" -D "/tmp/source/$yy"
            fi
          done
      - run: python research_pure_box_large_gap_tail_year_v4.py --year ${{ matrix.year }} --indir /tmp/source --labels /tmp/prep/tail_labeled_candidates.csv.gz --outdir /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: gap-tail-${{ matrix.year }}
          path: /tmp/result/*
          retention-days: 7

  combine:
    needs: year
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with: {pattern: gap-tail-20*, path: /tmp/shards}
      - uses: actions/download-artifact@v4
        with: {name: gap-tail-prepared, path: /tmp/prep}
      - run: python research_pure_box_large_gap_tail_combine_v4.py --indir /tmp/shards --outdir /tmp/final
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/final/summary.json'))
          a=pd.read_csv('/tmp/final/annual_results.csv')
          s=pd.read_csv('/tmp/final/summary_table.csv')
          c=pd.read_csv('/tmp/final/support_checks.csv')
          assert d['schema']=='LARGE-GAP-TAIL-EXCLUSION-V4'
          assert len(a)==120 and len(s)==20 and len(c)==8
          print(json.dumps({k:d[k] for k in ('expanding_passed','expanding_total','fixed_passed','fixed_total')},indent=2))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/large_gap_tail_exclusion_v4
          cp /tmp/prep/thresholds_by_year.csv research/pure_box_liquid_leaders_v1/large_gap_tail_exclusion_v4/
          cp /tmp/final/summary.json research/pure_box_liquid_leaders_v1/large_gap_tail_exclusion_v4/
          cp /tmp/final/support_checks.csv research/pure_box_liquid_leaders_v1/large_gap_tail_exclusion_v4/
          cp /tmp/final/summary_table.csv research/pure_box_liquid_leaders_v1/large_gap_tail_exclusion_v4/
          cp /tmp/final/annual_results.csv research/pure_box_liquid_leaders_v1/large_gap_tail_exclusion_v4/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/large_gap_tail_exclusion_v4
          git commit -m 'research: run Large Gap Tail Exclusion V4' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
