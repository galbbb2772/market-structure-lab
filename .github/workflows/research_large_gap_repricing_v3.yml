name: Research Large Gap Repricing V3

on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/large_gap_repricing_v3/PREREGISTRATION.md'
      - 'research_pure_box_large_gap_repricing_year_v3.py'
      - 'research_pure_box_large_gap_repricing_combine_v3.py'
      - '.github/workflows/research_large_gap_repricing_v3.yml'

permissions:
  contents: write
  actions: read

jobs:
  year:
    strategy:
      fail-fast: false
      matrix:
        year: [2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - name: Download source artifacts
        run: |
          mkdir -p /tmp/source
          y=${{ matrix.year }}
          for yy in $((y-1)) $y $((y+1)); do
            if [ "$yy" -ge 2019 ] && [ "$yy" -le 2026 ]; then
              mkdir -p "/tmp/source/$yy"
              gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -n "pure-box-liquid-$yy" -D "/tmp/source/$yy"
            fi
          done
      - run: python research_pure_box_large_gap_repricing_year_v3.py --year ${{ matrix.year }} --indir /tmp/source --outdir /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: gap-repricing-${{ matrix.year }}
          path: /tmp/result/*
          retention-days: 7

  combine:
    needs: year
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with: {pattern: gap-repricing-*, path: /tmp/shards}
      - run: python research_pure_box_large_gap_repricing_combine_v3.py --indir /tmp/shards --outdir /tmp/final
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/final/summary.json'))
          c=pd.read_csv('/tmp/final/support_checks.csv')
          e=pd.read_csv('/tmp/final/event_summary.csv')
          p=pd.read_csv('/tmp/final/portfolio_summary.csv')
          assert d['schema']=='LARGE-GAP-REPRICING-V3'
          assert len(d['support'])==3 and len(c)==24
          assert len(e)>=40 and len(p)>=50
          print(json.dumps(d['support'],indent=2))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/large_gap_repricing_v3
          cp /tmp/final/summary.json research/pure_box_liquid_leaders_v1/large_gap_repricing_v3/
          cp /tmp/final/support_checks.csv research/pure_box_liquid_leaders_v1/large_gap_repricing_v3/
          cp /tmp/final/event_summary.csv research/pure_box_liquid_leaders_v1/large_gap_repricing_v3/
          cp /tmp/final/portfolio_summary.csv research/pure_box_liquid_leaders_v1/large_gap_repricing_v3/
          cp /tmp/final/annual_event_stats.csv research/pure_box_liquid_leaders_v1/large_gap_repricing_v3/
          cp /tmp/final/annual_portfolio_stats.csv research/pure_box_liquid_leaders_v1/large_gap_repricing_v3/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/large_gap_repricing_v3
          git commit -m 'research: run Large Gap Repricing V3' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
