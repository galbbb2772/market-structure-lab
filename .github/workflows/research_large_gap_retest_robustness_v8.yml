name: Research Large Gap Retest Robustness V8

on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/large_gap_retest_robustness_v8/PREREGISTRATION.md'
      - 'research_pure_box_large_gap_retest_robustness_v8.py'
      - '.github/workflows/research_large_gap_retest_robustness_v8.yml'

permissions:
  contents: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      ANATOMY_RUN: 37573754734
      RESILIENCE_RUN: 37558533895
      GEOMETRY_RUN: 37575291654
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - name: Download frozen labels and V6 events
        run: |
          mkdir -p /tmp/anatomy /tmp/resilience /tmp/events
          gh run download "$ANATOMY_RUN" -R "${{ github.repository }}" -n "selloff-anatomy-mechanism" -D /tmp/anatomy
          gh run download "$RESILIENCE_RUN" -R "${{ github.repository }}" -n "relative-resilience-mechanism" -D /tmp/resilience
          for y in 2021 2022 2023 2024 2025 2026; do
            mkdir -p "/tmp/events/$y"
            gh run download "$GEOMETRY_RUN" -R "${{ github.repository }}" -n "gap-geometry-$y" -D "/tmp/events/$y"
          done
      - name: Run V8
        run: |
          python research_pure_box_large_gap_retest_robustness_v8.py \
            --anatomy-labels /tmp/anatomy/labeled_candidates.csv.gz \
            --resilience-labels /tmp/resilience/labeled_candidates.csv.gz \
            --events-dir /tmp/events \
            --outdir /tmp/final
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/final/summary.json'))
          r=pd.read_csv('/tmp/final/robustness_checks.csv')
          l=pd.read_csv('/tmp/final/leave_one_year_out.csv')
          assert d['schema']=='LARGE-GAP-RETEST-ROBUSTNESS-V8'
          assert len(r)==8
          assert len(r[r.rank_cap==500])==4
          assert len(l)==48
          print(json.dumps({k:d[k] for k in ['top500_broadly_robust','top500_total','top500_positive_2026','verdict']},indent=2))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/large_gap_retest_robustness_v8
          cp /tmp/final/summary.json research/pure_box_liquid_leaders_v1/large_gap_retest_robustness_v8/
          cp /tmp/final/robustness_checks.csv research/pure_box_liquid_leaders_v1/large_gap_retest_robustness_v8/
          cp /tmp/final/leave_one_year_out.csv research/pure_box_liquid_leaders_v1/large_gap_retest_robustness_v8/
          cp /tmp/final/thresholds_by_year.csv research/pure_box_liquid_leaders_v1/large_gap_retest_robustness_v8/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/large_gap_retest_robustness_v8
          git commit -m 'research: run Large Gap Retest Robustness V8' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
