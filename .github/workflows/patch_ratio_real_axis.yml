name: Patch Real Ratio Axis

on:
  push:
    paths:
      - 'patch_ratio_real_axis.py'
      - '.github/workflows/patch_ratio_real_axis.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch ratio chart to real values
        run: python patch_ratio_real_axis.py
      - name: Commit patched page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ratio-history.html
          git diff --cached --quiet || git commit -m 'fix: show true up-down ratio without 3.0 cap'
          git push
