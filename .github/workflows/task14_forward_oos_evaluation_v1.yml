name: Task 1/4 Forward-OOS Evaluation V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evaluate_task14_forward_oos_v1.py'
      - 'research/task14_prospective_evaluation_v1/PROTOCOL.md'
      - '.github/workflows/task14_forward_oos_evaluation_v1.yml'
      - 'docs/data/market_state_box_v1.json'
      - 'docs/data/residual_mean_reversion_distance_forward_oos_v1.json'
      - 'docs/data/task14_challenger_forward_oos_v1.json'

permissions:
  contents: write

concurrency:
  group: task14-forward-oos-eval-v1
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Evaluate frozen Forward-OOS ledgers
        run: python evaluate_task14_forward_oos_v1.py
      - name: Validate evaluation output
        run: |
          python - <<'PY'
          import json
          p='docs/data/task14_forward_oos_evaluation_v1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['schema']=='TASK14-FORWARD-OOS-EVALUATION-V1'
          assert d['research_only'] is True and d['observation_only'] is True
          assert d['production_effect']=='none'
          assert d['frozen_through_market_date']=='2026-10-02'
          assert d['primary_confirmatory_n']==20
          for k in ('rmd3','dplus1_entry','dual_severity_hazard','early_sequence'):
              assert k in d['tests']
              assert d['tests'][k]['status'] in ('PENDING','PASS','FAIL')
          assert d['overall']['automatic_production_change'] is False
          print('TASK14_FORWARD_OOS_EVAL_VALID', {k:(v['status'],v['primary_sample_n'],v['readiness']['ready']) for k,v in d['tests'].items()})
          PY
      - name: Commit evaluation board
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/task14_forward_oos_evaluation_v1.json
          if git diff --cached --quiet; then
            echo 'No evaluation-board change.'
          else
            git commit -m 'data: refresh Task 1/4 Forward-OOS evaluation V1'
            git pull --rebase origin main
            git push
          fi
