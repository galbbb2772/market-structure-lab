name: Research Pure Box Replacement Fragility V38
on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/replacement_fragility_v38/PREREGISTRATION.md'
      - 'research_pure_box_replacement_fragility_v38.py'
      - '.github/workflows/research_pure_box_replacement_fragility_v38.yml'
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas
      - run: python research_pure_box_replacement_fragility_v38.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('research/pure_box_liquid_leaders_v1/replacement_fragility_v38/summary.json'))
          assert d['schema']=='PURE-BOX-SIMPLE-CORE-REPLACEMENT-FRAGILITY-V38'
          print(json.dumps(d,indent=2))
          PY
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/replacement_fragility_v38
          git commit -m 'research: run Pure Box Replacement Fragility V38' || exit 0
          git push
