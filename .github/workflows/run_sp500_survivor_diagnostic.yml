name: Run S&P Survivor Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_sp500_survivor_diagnostic.py'
      - '.github/workflows/run_sp500_survivor_diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: sp500-survivor-diagnostic
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run diagnostic
        run: python research_sp500_survivor_diagnostic.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/sp500_survivor_diagnostic.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "data: refresh S&P survivor diagnostic"
            git pull --rebase origin main
            git push origin main
          fi
