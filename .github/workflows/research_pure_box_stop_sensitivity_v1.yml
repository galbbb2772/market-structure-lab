name: Research Pure Box Stop Sensitivity V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/pure-box-long-liquid-leaders-v1
    paths:
      - 'research_pure_box_stop_sensitivity.py'
      - '.github/workflows/research_pure_box_stop_sensitivity_v1.yml'

permissions:
  contents: write
  actions: read

jobs:
  sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - name: Download frozen yearly artifacts from original broad-market run
        run: |
          mkdir -p /tmp/pure_box_all
          gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -D /tmp/pure_box_all
          find /tmp/pure_box_all -maxdepth 2 -type f | sort | head -30
      - name: Run stop sensitivity
        run: python research_pure_box_stop_sensitivity.py --indir /tmp/pure_box_all --outdir /tmp/stop_sensitivity
      - name: Validate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/stop_sensitivity/summary.json'))
          assert d['schema']=='PURE-BOX-STOP-SENSITIVITY-V1'
          assert 'fixed_5pct' in d['results']['top500']
          assert d['results']['top500']['fixed_5pct']['trade_stats_all']['trades']>0
          print(json.dumps({k:v['portfolio'] for k,v in d['results']['top500'].items()},indent=2))
          PY
      - name: Persist aggregate outputs
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/stop_sensitivity_v1
          cp /tmp/stop_sensitivity/summary.json research/pure_box_liquid_leaders_v1/stop_sensitivity_v1/
          cp /tmp/stop_sensitivity/comparison.csv research/pure_box_liquid_leaders_v1/stop_sensitivity_v1/
          cp /tmp/stop_sensitivity/top500_yearly.csv research/pure_box_liquid_leaders_v1/stop_sensitivity_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/stop_sensitivity_v1
          if git diff --cached --quiet; then
            echo 'No aggregate change.'
          else
            git commit -m 'research: run Pure Box stop sensitivity V1'
            git push
          fi
