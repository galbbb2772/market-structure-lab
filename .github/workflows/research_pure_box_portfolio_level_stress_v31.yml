name: Research Pure Box Portfolio-Level Stress V31
on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/portfolio_level_stress_v31/PREREGISTRATION.md'
      - 'research_pure_box_portfolio_level_stress_v31.py'
      - '.github/workflows/research_pure_box_portfolio_level_stress_v31.yml'
permissions: {contents: write, actions: read}
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas
      - run: |
          mkdir -p /tmp/source
          gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -D /tmp/source
      - run: python research_pure_box_portfolio_level_stress_v31.py --indir /tmp/source --outdir /tmp/result
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/result/summary.json'));r=pd.read_csv('/tmp/result/results.csv')
          assert d['schema']=='PURE-BOX-SIMPLE-CORE-PORTFOLIO-LEVEL-STRESS-V31'
          assert len(r)==24
          print(r[['rank_cap','lane','cost_bps_side','delay_sessions','total_return','max_drawdown','daily_sharpe','rolling_12m_min_return']].to_string(index=False))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/portfolio_level_stress_v31
          cp /tmp/result/* research/pure_box_liquid_leaders_v1/portfolio_level_stress_v31/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/portfolio_level_stress_v31
          git commit -m 'research: run corrected portfolio-level stress V31' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
