name: Backtest UpDown Index V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backtest_updown_index.py'
      - 'docs/data/structure_lab.json'
      - '.github/workflows/backtest_updown_index.yml'

permissions:
  contents: write

concurrency:
  group: updown-index-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run index-only V1 backtest
        run: python backtest_updown_index.py

      - name: Commit backtest result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/updown_index_backtest.json
          if git diff --cached --quiet; then
            echo "No backtest changes"
          else
            git commit -m "data: refresh updown index V1 backtest"
            git push
          fi
