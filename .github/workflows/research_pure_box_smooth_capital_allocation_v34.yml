name: Research Pure Box Smooth Capital Allocation V34
on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/smooth_capital_allocation_v34/PREREGISTRATION.md'
      - 'research_pure_box_smooth_capital_allocation_v34.py'
      - '.github/workflows/research_pure_box_smooth_capital_allocation_v34.yml'
permissions: {contents: write, actions: read}
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37424716935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas
      - run: |
          mkdir -p /tmp/source
          gh run download "$SOURCE_RUN" -R "${{ github.repository }}" -D /tmp/source
      - run: python research_pure_box_smooth_capital_allocation_v34.py --indir /tmp/source --outdir /tmp/result
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/result/summary.json'));r=pd.read_csv('/tmp/result/results.csv')
          assert d['schema']=='PURE-BOX-SIMPLE-CORE-SMOOTH-CAPITAL-ALLOCATION-V34'
          assert len(r)==6
          print(r.to_string(index=False))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/smooth_capital_allocation_v34
          cp /tmp/result/* research/pure_box_liquid_leaders_v1/smooth_capital_allocation_v34/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/smooth_capital_allocation_v34
          git commit -m 'research: run Pure Box Smooth Capital Allocation V34' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
