name: Refresh Market Structure Lab Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/structure_lab_refresh.yml'
      - 'build_structure_lab.py'
      - 'build_status.py'
      - 'structure_core.py'
      - 'requirements.txt'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: structure-lab-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build real historical dataset
        run: |
          python build_structure_lab.py
          python build_status.py

      - name: Commit refreshed public dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/structure_lab.json docs/data/status.json
          if git diff --cached --quiet; then
            echo "No dataset changes"
            exit 0
          fi
          git commit -m "data: refresh market structure lab"
          git push
