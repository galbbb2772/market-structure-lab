name: Refresh Market Structure Lab Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/structure_lab_refresh.yml'
      - 'build_updown_core.py'
      - 'build_status.py'
      - 'structure_core.py'
      - 'requirements.txt'
      - 'tests/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: structure-lab-refresh
  cancel-in-progress: true

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Refresh three-index dataset
        run: |
          python build_updown_core.py
          python build_status.py

      - name: Commit refreshed public dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/structure_lab.json docs/data/status.json
          if git diff --cached --quiet; then
            echo "No dataset changes"
          else
            git commit -m "data: refresh three-index up/down dataset"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
