name: Research UpDown Divergence OOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_updown_divergence_oos.py'
      - 'research_updown_divergence_events.py'
      - '.github/workflows/research_updown_divergence_oos.yml'
      - 'docs/data/structure_lab.json'

concurrency:
  group: updown-divergence-oos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run divergence OOS robustness study
        run: python research_updown_divergence_oos.py
      - name: Commit OOS result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/updown_divergence_oos.json
          git diff --cached --quiet || git commit -m 'data: update divergence OOS study'
          git push
