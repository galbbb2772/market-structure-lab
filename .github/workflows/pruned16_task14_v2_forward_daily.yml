name: PRUNED16 Task14 V2 Forward Daily

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_matched_control_relative_state_forward_oos_v1.py"
      - "research/matched_control_relative_state_forward_oos_v1/**"
      - ".github/workflows/pruned16_task14_v2_forward_daily.yml"
  schedule:
    - cron: '45 23 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: pruned16-task14-v2-forward-daily
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt

      - name: Require initialized V2 lineage
        run: |
          python - <<'PY'
          import json
          m=json.load(open('docs/data/pruned16_v2/MANIFEST.json',encoding='utf-8'))
          assert m['market_model_version']=='MARKET-MODEL-V2-PRUNED16-2026-10-06'
          assert m['pruned16_v2_complete_event_count']==11
          print('V2_LINEAGE_READY')
          PY

      - name: Materialize V2 ledgers into disposable legacy engine paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,re
          base=Path('docs/data/pruned16_v2')
          names=[
            'residual_mean_reversion_distance_forward_oos_v1.json',
            'matched_control_relative_state_forward_oos_v1.json',
            'task14_challenger_forward_oos_v1.json',
            'task14_forward_oos_evaluation_v1.json',
            'task14_paper_execution_ledger_v1.json',
            'task14_paper_multiasset_v1.json',
            'task14_paper_portfolio_v1.json',
            'task14_stage4_stock_candidate_adapter_v1.json',
            'task14_stage4_stock_paper_execution_v1.json',
          ]
          for n in names:
              if (base/n).exists(): shutil.copy2(base/n,Path('docs/data')/n)
          files=[
            'build_residual_mean_reversion_distance_forward_oos_v1.py',
            'build_task14_challenger_forward_oos_v1.py',
            'evaluate_task14_forward_oos_v1.py',
            'build_task14_paper_execution_ledger_v1.py',
            'research_task14_stage4_multiasset_v1.py',
            'build_task14_paper_multiasset_v1.py',
            'research_task14_stage4_portfolio_v1.py',
            'build_task14_paper_portfolio_v1.py',
            'build_task14_stage4_stock_candidate_adapter_v1.py',
            'build_task14_stage4_stock_paper_execution_v1.py',
          ]
          for p in files:
              q=Path(p);s=q.read_text(encoding='utf-8').replace('2026-10-02','2026-10-06')
              if p in ('build_residual_mean_reversion_distance_forward_oos_v1.py','build_task14_challenger_forward_oos_v1.py'):
                  s=re.sub(r'FREEZE_COMMIT = "[0-9a-f]+"','FREEZE_COMMIT = "cf5a0d9c92c28176bf33f98e6f68c574675a19f6"',s)
              q.write_text(s,encoding='utf-8')
          PY

      - name: Refresh current PRUNED16 state history
        run: |
          python build_market_state_box_v1.py
          python postprocess_market_state_box_v1.py

      - name: Append V2 Forward-OOS only
        run: |
          python build_residual_mean_reversion_distance_forward_oos_v1.py
          python build_task14_challenger_forward_oos_v1.py
          python build_matched_control_relative_state_forward_oos_v1.py
          python evaluate_task14_forward_oos_v1.py

      - name: Refresh V2 paper layers
        run: |
          python build_task14_paper_execution_ledger_v1.py
          python build_task14_paper_multiasset_v1.py
          python build_task14_paper_portfolio_v1.py
          python build_task14_stage4_stock_candidate_adapter_v1.py
          python build_task14_stage4_stock_paper_execution_v1.py

      - name: Validate append-only freeze
        run: |
          python - <<'PY'
          import json
          for n in ('residual_mean_reversion_distance_forward_oos_v1.json','matched_control_relative_state_forward_oos_v1.json','task14_challenger_forward_oos_v1.json','task14_forward_oos_evaluation_v1.json'):
              d=json.load(open('docs/data/'+n,encoding='utf-8'))
              assert d.get('frozen_through_market_date')=='2026-10-06',(n,d.get('frozen_through_market_date'))
          print('V2_FORWARD_FREEZE_VALID')
          PY

      - name: Save only V2 forward and paper outputs
        run: |
          set -e
          mkdir -p /tmp/v2-forward
          for n in             residual_mean_reversion_distance_forward_oos_v1.json             matched_control_relative_state_forward_oos_v1.json             task14_challenger_forward_oos_v1.json             task14_forward_oos_evaluation_v1.json             task14_paper_execution_ledger_v1.json             task14_paper_multiasset_v1.json             task14_paper_portfolio_v1.json             task14_stage4_stock_candidate_adapter_v1.json             task14_stage4_stock_paper_execution_v1.json; do
              cp docs/data/$n /tmp/v2-forward/$n
          done
          git fetch origin main
          git reset --hard origin/main
          for n in /tmp/v2-forward/*.json; do cp "$n" docs/data/pruned16_v2/; done
          git add docs/data/pruned16_v2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No V2 forward changes.'
          else
            git commit -m 'data: refresh PRUNED16 Task1/4 V2 Forward-OOS ledgers'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
