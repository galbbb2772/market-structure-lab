name: Cross Family Transition Stage-2 V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_cross_family_transition_stage2_v1.py'
      - 'research/cross_family_transition_stage2_v1/STUDY_SPEC.md'
      - 'docs/data/market_state_box_v1.json'
      - 'docs/data/factor_map_stage2_v1.json'
      - 'build_market_state_sequence_v1.py'
      - 'research_modules_stage2_v1.py'
      - 'research_factor_map_stage2_v1.py'
      - '.github/workflows/cross_family_transition_stage2_v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run transition study
        run: python research_cross_family_transition_stage2_v1.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          p='docs/data/cross_family_transition_stage2_v1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['schema']=='CROSS-FAMILY-TRANSITION-STAGE2-V1'
          assert d['research_only'] is True and d['diagnostic_only'] is True
          assert d['production_effect']=='none' and d['thresholds_changed'] is False
          assert d['decision']['may_change_production'] is False
          assert d['decision']['may_change_forward_oos'] is False
          c=d['transition_study']['event_counts']
          assert c['sentiment_extreme']==22
          assert c['full_sequence']==12
          assert c['early_sequence']==15
          assert d['sparse_factor_followup']['horizons']['10d']['common_complete_case_n']>1000
          assert len(d['transition_study']['matrix'])==8
          print('CROSS_FAMILY_TRANSITION_VALID', c)
          PY
      - name: Commit research data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/cross_family_transition_stage2_v1.json
          if git diff --cached --quiet; then
            echo 'No transition data change.'
          else
            git commit -m 'data: refresh cross-family transition Stage-2 V1'
            git pull --rebase origin main
            git push
          fi
