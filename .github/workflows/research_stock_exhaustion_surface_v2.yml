name: Research Stock Exhaustion Surface V2

on:
  workflow_dispatch:
  push:
    branches: [research/pure-box-long-liquid-leaders-v1]
    paths:
      - 'research/pure_box_liquid_leaders_v1/stock_exhaustion_surface_v2/PREREGISTRATION.md'
      - 'research_pure_box_stock_exhaustion_surface_v2.py'
      - '.github/workflows/research_stock_exhaustion_surface_v2.yml'

permissions:
  contents: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: 37553377093
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Download frozen Strategy Reconstruction V1 observations
        run: |
          mkdir -p /tmp/reconstruction
          for y in 2019 2020 2021 2022 2023 2024 2025 2026; do
            mkdir -p "/tmp/reconstruction/$y"
            gh run download "$SOURCE_RUN" -R "${{ github.repository }}"               -n "strategy-reconstruction-$y" -D "/tmp/reconstruction/$y"
          done
      - name: Analyze exhaustion interaction surface
        run: |
          python research_pure_box_stock_exhaustion_surface_v2.py             --indir /tmp/reconstruction             --outdir /tmp/result
      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('/tmp/result/summary.json'))
          assert d['schema']=='LARGE-STOCK-EXHAUSTION-SURFACE-V2'
          s=pd.read_csv('/tmp/result/surface_5x5.csv')
          c=pd.read_csv('/tmp/result/corner_summary.csv')
          k=pd.read_csv('/tmp/result/support_checks.csv')
          assert len(s)>50
          assert len(c)==32
          assert len(k)==8
          print(json.dumps(d['support'],indent=2))
          PY
      - name: Persist
        run: |
          mkdir -p research/pure_box_liquid_leaders_v1/stock_exhaustion_surface_v2
          cp /tmp/result/summary.json research/pure_box_liquid_leaders_v1/stock_exhaustion_surface_v2/
          cp /tmp/result/surface_5x5.csv research/pure_box_liquid_leaders_v1/stock_exhaustion_surface_v2/
          cp /tmp/result/corner_summary.csv research/pure_box_liquid_leaders_v1/stock_exhaustion_surface_v2/
          cp /tmp/result/redundancy.csv research/pure_box_liquid_leaders_v1/stock_exhaustion_surface_v2/
          cp /tmp/result/support_checks.csv research/pure_box_liquid_leaders_v1/stock_exhaustion_surface_v2/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add research/pure_box_liquid_leaders_v1/stock_exhaustion_surface_v2
          git commit -m 'research: run Stock Exhaustion Surface V2' || exit 0
          git fetch origin research/pure-box-long-liquid-leaders-v1
          git rebase origin/research/pure-box-long-liquid-leaders-v1
          git push
