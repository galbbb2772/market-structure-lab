name: Run Pattern Edge Map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_pattern_edge_map.py'
      - 'research_pattern_oos_cells.py'
      - '.github/workflows/run_pattern_edge_map.yml'

permissions:
  contents: write

concurrency:
  group: pattern-edge-map-fast
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run edge-map research
        run: python research_pattern_edge_map.py
      - name: Run cell-level pseudo-OOS validation
        run: python research_pattern_oos_cells.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/pattern_edge_map.json docs/data/pattern_edge_oos_summary.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "data: refresh pattern edge validation"
            git push
          fi
